services:
  ai-service:
    build: ./ai-service
    ports:
      - "8010:8000"
    env_file:
      - ./ai-service/.env
    restart: unless-stopped

  rag-service:
    build: ./rag-service
    ports:
      - "8011:8000"
    env_file:
      - ./rag-service/.env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - qdrant
      - redis
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.4
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
